# Local Postgres for development and tests (needs btree_gist, which the standard image ships).
#   docker compose up -d db
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54329/showup
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: showup
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d showup"]
      interval: 3s
      retries: 20
